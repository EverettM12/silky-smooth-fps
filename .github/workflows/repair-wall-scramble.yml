name: repair-wall-scramble
on:
  push:
    branches:
      - testing
permissions:
  contents: write
jobs:
  repair:
    if: github.actor == 'EverettM12'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
      - name: Repair traversal schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("player/player_traversal.gd")
          text = path.read_text(encoding="utf-8")
          old = 'var wall_position: Vector3 = wall_data["position"] as Vector3\nvar wall_normal_value: Vector3 = wall_data["normal"] as Vector3\nvar wall_rid: RID = wall_data.get("rid", RID()) as RID\nvar wall_distance: float = wall_data.get("distance", 0.0) as float'
          new = 'var wall_position: Vector3 = wall_data.get("position", wall_data.get("front_position", Vector3.ZERO)) as Vector3\nvar wall_normal_value: Vector3 = wall_data.get("normal", Vector3.ZERO) as Vector3\nvar wall_rid: RID = wall_data.get("rid", RID()) as RID\nvar wall_distance: float = wall_data.get("distance", player.global_position.distance_to(wall_position)) as float'
          if old not in text:
              raise SystemExit("wall schema pattern not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "EverettM12"
          git config user.email "metivaeverett@gmail.com"
          git add player/player_traversal.gd
          git rm .github/workflows/repair-wall-scramble.yml
          git commit -m "Fix wall scramble wall data normalization"
          git push origin HEAD:testing
